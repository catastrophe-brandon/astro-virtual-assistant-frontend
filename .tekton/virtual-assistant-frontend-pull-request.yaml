apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    build.appstudio.openshift.io/repo: https://github.com/RedHatInsights/astro-virtual-assistant-frontend?rev={{revision}}
    build.appstudio.redhat.com/commit_sha: '{{revision}}'
    build.appstudio.redhat.com/pull_request_number: '{{pull_request_number}}'
    build.appstudio.redhat.com/target_branch: '{{target_branch}}'
    pipelinesascode.tekton.dev/max-keep-runs: "3"
    pipelinesascode.tekton.dev/on-cel-expression: event == "pull_request" && target_branch == "main"
  creationTimestamp:
  labels:
    appstudio.openshift.io/application: virtual-assistant
    appstudio.openshift.io/component: virtual-assistant-frontend
    pipelines.appstudio.openshift.io/type: build
  name: virtual-assistant-frontend-on-pull-request
  namespace: hcc-platex-services-tenant
spec:
  params:
  - name: git-url
    value: '{{source_url}}'
  - name: revision
    value: '{{revision}}'
  - name: output-image
    value: quay.io/redhat-user-workloads/hcc-platex-services-tenant/virtual-assistant/virtual-assistant-frontend:on-pr-{{revision}}
  - name: image-expires-after
    value: 5d
  - name: dockerfile
    value: build-tools/Dockerfile

  # Workspace setup - install dependencies BEFORE tests run
  - name: workspace-setup-script
    value: |
      #!/bin/bash
      set -ex
      # Install npm dependencies (including Playwright)
      npm ci
      # Note: Playwright browsers are pre-installed in the playwright image
      # when image version matches package.json (both 1.60.0)

  # Unit tests script
  - name: unit-tests-script
    value: |
      #!/bin/bash
      set -ex
      # --runInBand is required: parallel Jest workers use too much memory for CI.
      npm run test -- --runInBand
      echo "Exit code: $?"
     

  # E2E tests script - ONLY run tests, dependencies installed in workspace-setup-script
  - name: e2e-tests-script
    value: |
      #!/bin/bash
      set -ex

      # Wait for connectivity through the dev proxy to the console root.
      echo "Waiting for dev proxy connectivity..."
      if ! timeout 120s bash -c '
        until curl -kfsS --connect-timeout 5 --max-time 10 \
          --output /dev/null https://stage.foo.redhat.com:1337/; do
          echo "Dev proxy not ready yet; retrying..."
          sleep 1
        done
      '; then
        echo "ERROR: Dev proxy readiness failed within the 120-second limit; skipping Playwright." >&2
        echo "Hostname resolution for stage.foo.redhat.com:"
        getent hosts stage.foo.redhat.com || true
        echo "Verbose dev proxy connection diagnostics:"
        curl -vk --connect-timeout 5 --max-time 10 \
          --output /dev/null https://stage.foo.redhat.com:1337/ || true
        exit 1
      fi
      echo "Dev proxy connectivity established!"

      npx playwright test

  # Run app script - start Caddy to serve app assets
  - name: run-app-script
    value: |
      #!/bin/bash
      set -ex
      /usr/bin/caddy run --config /etc/caddy/Caddyfile --adapter caddyfile

  # E2E configuration
  - name: e2e-playwright-image
    value: "mcr.microsoft.com/playwright:v1.60.0-jammy"

  # ConfigMap and Secret names (will be created in next step)
  - name: frontend-proxy-routes-configmap
    value: "virtual-assistant-dev-proxy-caddyfile"

  - name: e2e-credentials-secret
    value: "virtual-assistant-credentials-secret"

  pipelineRef:
    params:
    - name: url
      value: https://github.com/RedHatInsights/konflux-pipelines
    - name: revision
      value: main
    - name: pathInRepo
      value: pipelines/platform-ui/docker-build-run-all-tests-v2.yaml
    resolver: git
  taskRunTemplate:
    serviceAccountName: build-pipeline-virtual-assistant-frontend
    podTemplate:
      # Resolve the dev proxy hostname to IPv4 loopback.
      hostAliases:
        - ip: "127.0.0.1"
          hostnames:
            - "stage.foo.redhat.com"
      # Increase resource limits for test stages (OOM prevention)
      containers:
      - name: step-workspace-setup
        resources:
          requests:
            memory: "2Gi"
            cpu: "1000m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
      - name: step-unit-tests
        resources:
          requests:
            memory: "4Gi"
            cpu: "1500m"
          limits:
            memory: "8Gi"
            cpu: "2000m"
  workspaces:
  - name: workspace
    volumeClaimTemplate:
      metadata:
        creationTimestamp:
      spec:
        accessModes:
        - ReadWriteOnce
        resources:
          requests:
            storage: 2Gi
      status: {}
  - name: git-auth
    secret:
      secretName: '{{ git_auth_secret }}'
status: {}
